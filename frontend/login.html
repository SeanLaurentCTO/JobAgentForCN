<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 职位链接收集</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-page">
  <main>
    <section class="card">
      <h1>职位链接收集</h1>
      <form id="login-form">
        <label for="password-input" class="label">请输入密码</label>
        <input
          id="password-input"
          class="text-input"
          type="password"
          autocomplete="current-password"
          required
        />
        <button class="primary-btn" type="submit">登录</button>
        <p id="login-message" class="message error" role="alert"></p>
      </form>
    </section>
  </main>

  <script src="/login.js"></script>
</body>
</html>
